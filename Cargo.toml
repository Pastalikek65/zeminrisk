[workspace]
resolver = "2"
members = [
    "crates/zemin-core",
    "crates/zemin-rt",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZeminRisk Contributors"]
license = "Apache-2.0"
repository = "https://github.com/zeminrisk/zeminrisk"
keywords = ["gis", "earthquake", "shakemap", "postgis", "remote-sensing"]
categories = ["science::geo", "algorithms"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
