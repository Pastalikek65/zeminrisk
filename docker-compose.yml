services:
  db:
    image: postgis/postgis:16-3.4
    container_name: zeminrisk-postgis
    environment:
      POSTGRES_DB: zeminrisk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zeminrisk_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/postgis/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zeminrisk"]
      interval: 5s
      timeout: 5s
      retries: 5

  tile-server:
    image: maplibre/martin:v0.14.2
    container_name: zeminrisk-martin
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:zeminrisk_dev_password@db:5432/zeminrisk
    ports:
      - "3000:3000"
    command: ["--save-config", "/config/martin.yaml"]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: zeminrisk-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgis_data:
  minio_data:
