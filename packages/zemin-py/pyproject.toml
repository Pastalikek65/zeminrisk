[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zemin"
version = "0.1.0"
description = "Python bindings and pipeline orchestration for ZeminRisk"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "shapely>=2.0.0",
    "geopandas>=1.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
zemin = "zemin.cli:main"
