[project]
name = "zeminrisk-workspace"
version = "0.1.0"
description = "High-performance seismic risk, real-time ShakeMap, and GeoAI disaster response platform"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.10",
    "rioxarray>=0.15.0",
    "xarray>=2024.3.0",
    "pystac-client>=0.8.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "maturin>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "hypothesis>=6.103.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "geopandas",
    "shapely",
    "shapely.*",
    "rasterio",
    "rasterio.*",
    "pystac_client",
    "pystac_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-ra -q"
